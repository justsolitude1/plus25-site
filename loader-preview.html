<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Loader · Plus 25</title>
<!-- The site loader on its own, so it can be watched without reloading a page. Unlisted. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Chakra+Petch:wght@500&display=swap">
<link rel="stylesheet" href="css/site.css?v=muaz5b8b">
<style>
  body { margin: 0; }
  .preloader { animation: none !important; }   /* it never hides here */
  .replay { position: fixed; left: 50%; bottom: 34px; translate: -50% 0; z-index: 300; }
</style>
<body>
<div class="preloader" id="preloader" role="status" aria-label="Loading">
  <div class="pl-sigil" aria-hidden="true">
    <span class="pl-glow"></span>
    <!-- the frame: three rings and the compass points -->
    <svg class="pl-frame" viewBox="0 0 200 200">
      <g fill="none" stroke="currentColor">
        <circle cx="100" cy="100" r="93" stroke-width=".8" opacity=".55"/>
        <circle cx="100" cy="100" r="89" stroke-width=".6" opacity=".35"/>
        <circle cx="100" cy="100" r="85" stroke-width="1.1"/>
        <path d="M100 0v18M100 182v18M0 100h18M182 100h18" stroke-width=".7" opacity=".6"/>
      </g>
      <g fill="currentColor">
        <path d="M100 1l4 6-4 6-4-6z"/><path d="M100 187l4 6-4 6-4-6z"/>
        <path d="M7 100l6-4 6 4-6 4z"/><path d="M181 100l6-4 6 4-6 4z"/>
      </g>
    </svg>
    <!-- the triangle, with a lit diamond at each vertex -->
    <svg class="pl-tri" viewBox="0 0 200 200">
      <path d="M100 20L168 139H32z" fill="none" stroke="currentColor" stroke-width="1.1"/>
      <path d="M100 20L100 139M100 20L32 139M100 20L168 139M32 139L168 139" fill="none" stroke="currentColor" stroke-width=".5" opacity=".35"/>
      <g fill="currentColor">
        <path d="M100 13l5 7-5 7-5-7z"/><path d="M168 132l5 7-5 7-5-7z"/><path d="M32 132l5 7-5 7-5-7z"/>
      </g>
    </svg>
    <!-- three overlapping circles, turning the other way -->
    <svg class="pl-petals" viewBox="0 0 200 200">
      <g fill="none" stroke="currentColor" stroke-width=".9" opacity=".65">
        <circle cx="100" cy="72" r="40"/><circle cx="66" cy="124" r="40"/><circle cx="134" cy="124" r="40"/><circle cx="100" cy="100" r="48" opacity=".5"/>
      </g>
    </svg>
    <!-- a dotted ring, slowest of all -->
    <svg class="pl-dotted" viewBox="0 0 200 200">
      <circle cx="100" cy="100" r="62" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-dasharray=".1 7" opacity=".7"/>
    </svg>
    <!-- the rune at the centre -->
    <svg class="pl-rune" viewBox="0 0 200 200">
      <g fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M100 78v54"/>
        <path d="M100 78 82 96M100 78l18 18"/>
        <path d="M74 70 86 100M126 70 114 100"/>
      </g>
      <path d="M100 62l6 9-6 9-6-9z" fill="currentColor"/>
      <path d="M100 128l4 6-4 8-4-8z" fill="currentColor"/>
    </svg>
    <!-- the outer ring fills as the page loads -->
    <svg class="pl-track" viewBox="0 0 200 200">
      <circle class="pl-arc" cx="100" cy="100" r="85" pathLength="100" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
    </svg>
  </div>
</div>
<button class="btn btn-ghost replay" id="again" type="button">Play the arc again</button>
<script>
  const arc = document.querySelector(".pl-arc");
  document.getElementById("again").addEventListener("click", () => {
    document.getElementById("preloader").classList.remove("is-complete");
    arc.style.animation = "none"; void arc.offsetWidth; arc.style.animation = "";
    setTimeout(() => document.getElementById("preloader").classList.add("is-complete"), 1050);
  });
  setTimeout(() => document.getElementById("preloader").classList.add("is-complete"), 1050);
</script>
</body>
</html>
